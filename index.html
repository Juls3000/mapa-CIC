<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Conceptual Teológico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        /* Basic styling for the network container and popup */
        #mynetwork {
            width: 100%;
            height: 75vh; /* Adjusted height slightly for the button */
            border: 1px solid lightgray;
            background-color: #f8fafc; /* Light background */
        }
        /* Ensure popup is above the network and overlay */
        #node-popup {
            z-index: 100;
        }
        /* Ensure overlay is above network but below popup */
        #overlay {
            z-index: 50;
        }
        /* Style for Vis.js tooltips (if needed, though we use a click popup) */
        .vis-tooltip {
            font-family: 'Inter', sans-serif;
            padding: 8px;
            background-color: #333;
            color: white;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            max-width: 300px; /* Limit tooltip width */
            white-space: pre-wrap; /* Allow line breaks */
        }
        /* Custom node styling */
        .vis-network .vis-node {
            font-family: 'Inter', sans-serif;
        }
        /* Style for the reset button container */
        #controls {
            text-align: center;
            margin-top: 1rem; /* Add some space above the button */
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<body class="font-['Inter'] bg-gray-100 p-4 md:p-8">

    <h1 class="text-2xl md:text-3xl font-semibold text-center text-gray-800 mb-6">Mapa Conceptual Teológico Interactivo</h1>
    <p class="text-center text-gray-600 mb-2">Haz clic en un nodo para ver su descripción y centrar la vista.</p>

    <div id="mynetwork" class="rounded-lg shadow-md"></div>

    <div id="controls">
        <button id="reset-view-button" class="mt-4 px-5 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-opacity-50 transition duration-150 ease-in-out">
            Restaurar Vista Completa
        </button>
    </div>

    <div id="node-popup" class="hidden fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-white p-6 rounded-lg shadow-xl max-w-md w-11/12 md:w-auto border border-gray-200">
        <h3 id="popup-title" class="text-xl font-semibold mb-3 text-blue-700"></h3>
        <p id="popup-description" class="text-gray-700 text-sm mb-4"></p>
        <button id="close-popup" class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition duration-150 ease-in-out">
            Cerrar
        </button>
    </div>
    <div id="overlay" class="hidden fixed inset-0 bg-black opacity-50"></div>

        // --- Constants for Colors ---
        const defaultNodeBgColor = '#60a5fa';
        const defaultNodeBorderColor = '#4b5563';
        const defaultNodeFontColor = '#374151';
        const defaultEdgeColor = '#9ca3af';

        const dimmedNodeFontColor = '#d1d5db';
        const dimmedEdgeColor = '#e5e7eb'; // Very light gray

        // --- Data Definition ---
        // Nodes: id, label (display name), description (for popup)
        const nodes = new vis.DataSet([
            // Add all 50 nodes here (same as before)
            { id: 1, label: 'Dios', description: 'El ser fundamental en el que se cree. Se revela como Trinidad (Padre, Hijo, Espíritu Santo). Es Creador del cielo y la tierra, fundamento de todo designio salvífico y fuente de toda verdad y bien. Es el fin último al que aspira el hombre. La oración es un diálogo con Él, y la vida cristiana busca conocer y cumplir Su voluntad. Es la Verdad misma.' },
            { id: 2, label: 'Jesucristo', description: 'El Hijo de Dios, el Verbo encarnado. Centro de la catequesis y de la Sagrada Escritura. Es el Camino, la Verdad y la Vida. Se dio a sí mismo en rescate y es el modelo a seguir para el cristiano. A través de Él, se accede al amor del Padre y se participa de la vida trinitaria.' },
            { id: 3, label: 'Espíritu Santo', description: 'La tercera persona de la Santísima Trinidad. Su misión en la liturgia es preparar el encuentro con Cristo y actualizar su obra salvífica. Ayuda a interpretar la Sagrada Escritura. Mediante Él, los cristianos son hechos partícipes de la condición filial y se les da un corazón nuevo con deseos santos. Impulsa el anuncio del Evangelio.' },
            { id: 4, label: 'Revelación Divina', description: 'El acto por el cual Dios se dirige y se da al hombre. Se desarrolla en la historia de la salvación. Su fin es que el hombre responda a Dios con la fe. Se contiene en la Sagrada Escritura y la Tradición Apostólica.' },
            { id: 5, label: 'Fe', description: 'La virtud teologal por la que se cree en Dios y en lo revelado. Es la respuesta del hombre a la Revelación. Se profesa en la Iglesia. Actúa por la caridad y lleva a buscar y hacer la voluntad de Dios.' },
            { id: 6, label: 'Esperanza', description: 'Virtud teologal que permite aspirar al bien total (Dios) y que se confía alcanzar. Se manifiesta en el sosiego y la perseverancia.' },
            { id: 7, label: 'Caridad', description: 'La virtud teologal que capacita para amar a Dios y al prójimo al modo divino. Es la plenitud de los mandamientos y el punto de arranque de la actividad cristiana. Implica comprender, perdonar, servir y sacrificarse.' },
            { id: 8, label: 'Iglesia', description: 'La asamblea de todos los santos. Es el Cuerpo de Cristo. Recibió y guarda la fe de los Apóstoles. Transmite y expresa su fe en fórmulas y símbolos. Su misión es extender el Reino de Dios.' },
            { id: 9, label: 'Hombre', description: 'Creado por Dios y capaz de Él. Posee dignidad y libertad. Está llamado a la vida cristiana y a la santidad, procurando vivir según su condición de hijo de Dios. Se relaciona con lo espiritual a través de signos y símbolos.' },
            { id: 10, label: 'Vida Cristiana', description: 'La vocación del hombre a vivir en el Espíritu, centrada en seguir a Jesucristo. Implica la lucha por adquirir las virtudes, cumplir los mandamientos, y vivir en oración constante. Se desarrolla en medio del mundo y busca la santidad.' },
            { id: 11, label: 'Vocación Cristiana', description: 'La llamada que se recibe al principio de la vida cristiana. Implica seguir los pasos de Jesucristo y es una llamada a la santidad. Se vive en medio del mundo, en las ocupaciones habituales.' },
            { id: 12, label: 'Seguir a Cristo', description: 'Esfuerzo por andar por donde Él anduvo, apoyar las plantas sobre la impronta de sus pisadas. Es el camino para la santidad y la identificación con Él.' },
            { id: 13, label: 'Identificación con Cristo', description: 'El objetivo de la vida cristiana, procurando convertirse de verdad en "otro Cristo" o "ipse Christus" entre los hombres. Implica hacer suyos sus pensamientos, afectos y acciones. Se logra siguiendo su ejemplo y a través de la oración.' },
            { id: 14, label: 'Filiación Divina', description: 'La condición del cristiano, que por la gracia del Bautismo se convierte en hijo de Dios por adopción. Se participa de ella por medio del Espíritu Santo. Implica vivir con la conciencia de ser hijos de un Padre amoroso y buscar cumplir Su voluntad. La promesa final es ser hijo de Dios.' },
            { id: 15, label: 'Gracia Divina', description: 'Don de Dios que hace posible obedecer Sus mandamientos, vivir las virtudes y alcanzar la santidad. Se recibe especialmente a través de los Sacramentos.' },
            { id: 16, label: 'Sacramentos', description: 'Celebraciones de la Iglesia que giran en torno al Misterio Pascual de Cristo. Son siete: Bautismo, Confirmación, Eucaristía, Penitencia, Unción, Orden, Matrimonio. Hacen presente la obra salvífica de Cristo y dan fruto personal y eclesial.' },
            { id: 17, label: 'Eucaristía', description: 'El sacramento central de la vida litúrgica de la Iglesia. Es el sacramento de los sacramentos, al cual se ordenan todos los demás.' },
            { id: 18, label: 'Decálogo', description: 'Las "diez palabras" que enuncian las exigencias del amor de Dios y del prójimo. Son un camino de vida liberado del pecado. Obligan a los cristianos y forman una unidad indisociable. Los tres primeros se refieren al amor de Dios, los otros siete al amor del prójimo.' },
            { id: 19, label: 'Virtudes', description: 'Disposiciones para obrar el bien. Son humanas y cristianas. Las teologales (Fe, Esperanza, Caridad) son dadas por Dios y tienen a Dios por objeto. Todas están interrelacionadas. Es preciso luchar por adquirirlas y practicarlas todas.' },
            { id: 20, label: 'Oración', description: 'Diálogo o conversación con Dios. Es esencial en la vida cristiana. Puede ser vocal, meditación o contemplación. Brota de la conciencia de la propia indigencia. Permite acercarse más a Dios y sentirse con fuerza para extender el bien.' },
            { id: 21, label: 'Meditación', description: 'Forma de oración que implica reflexionar sobre textos (bíblicos, espirituales) o la propia vida para conocer a Dios y su voluntad. Es una búsqueda de Alguien (Dios).' },
            { id: 22, label: 'Contemplación', description: 'Forma de oración que, partiendo de la oración vocal o la meditación, lleva a un recogimiento del corazón en presencia de Dios. Se describe como un camino para sentirse amigo del Maestro. Puede convertirse en apostolado.' },
            { id: 23, label: 'Pecado', description: 'Rompimiento de la ley de Dios. Esclaviza al hombre. El cristiano lucha contra él. Incluye pecados internos como la soberbia y la codicia.' },
            { id: 24, label: 'Mundo', description: 'La realidad creada por Dios. El cristiano vive en el mundo pero no es mundano. Es el lugar donde se vive la vocación cristiana, se ejerce el trabajo y el apostolado, y se busca extender el reino de Cristo santificando sus estructuras.' },
            { id: 25, label: 'Reino de Dios/Cristo', description: 'La realidad que Jesucristo vino a instaurar. La tarea del cristiano es colaborar en su extensión en la tierra. Implica más amor, paz y justicia.' },
            { id: 26, label: 'Trabajo', description: 'Quehacer humano que, vivido con sentido sobrenatural, es medio de santificación y apostolado. Se ofrece a Dios y se realiza con empeño y diligencia. Se vive en medio de las ocupaciones habituales del mundo.' },
            { id: 27, label: 'Libertad Cristiana', description: 'La libertad que Cristo ha ganado, propia de la persona humana. Implica responsabilidad. No es una barrera o ídolo, sino que requiere un compromiso serio. Permite intervenir en diversas cuestiones sin más límites que el Magisterio de la Iglesia.' },
            { id: 28, label: 'Pureza de Corazón', description: 'Orden y armonía interior. Significa tener un modo santo de sentir y desear. Es alabada por Jesús. Se busca luchando contra los pecados internos y desordenados. Permite una apertura al prójimo y amar a Dios con todo el corazón.' },
            { id: 29, label: 'Santidad', description: 'La tarea para toda la vida cristiana. Implica identificarse con Jesucristo y vivir las virtudes. Se logra en medio del mundo, santificando las realidades temporales, incluyendo el trabajo. Requiere gracia.' },
            { id: 30, label: 'Verdad', description: 'Realidad que Dios ha revelado y que la Iglesia enseña. Jesucristo es la Verdad. El cristiano debe vivir conforme a ella y anunciarla.' },
            { id: 31, label: 'Evangelio', description: 'Contiene por escrito el Evangelio predicado por los Apóstoles. Narra la vida y enseñanzas de Jesús para que se crea en Él y se tenga vida. Es la base de la catequesis y el apostolado.' },
            { id: 32, label: 'Magisterio de la Iglesia', description: 'La autoridad de la Iglesia que interpreta auténticamente la Palabra de Dios contenida en la Sagrada Escritura y la Tradición Apostólica. Propone lo que se debe creer y establece límites para la libertad del cristiano en ciertas materias. Fuente principal del Catecismo y la doctrina social.' },
            { id: 33, label: 'Tradición Apostólica', description: 'La transmisión viva del Evangelio en la Iglesia. Contiene la lista de los Libros Santos (canon) y, junto con la Sagrada Escritura, es fuente de la Revelación Divina.' },
            { id: 34, label: 'Sagrada Escritura', description: 'Libros Santos inspirados por Dios. Es una de las fuentes principales de la doctrina católica. Se ha de leer e interpretar con el mismo Espíritu con que fue escrita, prestando atención a su unidad y teniendo a Cristo como centro.' },
            { id: 35, label: 'Nueva Jerusalén', description: 'La realidad futura donde Dios renovará todo. Es el lugar donde se cumplirá la promesa final a los que venzan.' },
            { id: 36, label: 'Vencedor', description: 'Aquel que supera las dificultades, las tentaciones y se vence a sí mismo por amor de Dios. Es a quien se dirige la promesa final de Dios en la Nueva Jerusalén.' },
            { id: 37, label: 'Promesa Final', description: 'La promesa definitiva de Dios a los que venzan. Implica que Él será su Dios y ellos serán Sus hijos, en el contexto de la renovación de todo en la Nueva Jerusalén.' },
            { id: 38, label: 'Catequesis', description: 'La exposición orgánica y sintética de la doctrina católica. Tiene a Jesucristo como centro esencial. Se basa en la Escritura, Tradición y Magisterio. Busca introducir en el Misterio de Cristo y llevar a la comunión con Él. Está unida a toda la vida de la Iglesia.' },
            { id: 39, label: 'Liturgia', description: 'La celebración del misterio de Cristo en la Iglesia. Implica signos y símbolos. Gira en torno al Sacrificio Eucarístico y los Sacramentos. La catequesis litúrgica busca introducir en este misterio.' },
            { id: 40, label: 'Humildad', description: 'Virtud fundamental que enlaza a las otras y fundamenta la eficacia de la lucha espiritual. Implica luchar contra la soberbia y reconocer la propia indigencia ante Dios. Jesús es modelo de humildad.' },
            { id: 41, label: 'Sinceridad', description: 'Virtud necesaria para la lucha espiritual. Va unida a la humildad. Implica ser "salvajemente sinceros" con prudencia y ayuda a vencer el pecado, especialmente la soberbia.' },
            { id: 42, label: 'Templanza', description: 'Virtud que permite moderar el uso de los bienes materiales y los afectos. Sus frutos incluyen la sobriedad, modestia, comprensión, recato. Lucha contra la destemplanza y la impureza. No es limitación, sino grandeza.' },
            { id: 43, label: 'Prudencia', description: 'Virtud necesaria para dar criterio, fortalecer, corregir. Guía la sinceridad con educación.' },
            { id: 44, label: 'Justicia', description: 'Virtud que se entrelaza con otras. Implica obrar el bien y buscarla en el mundo. Forma parte de la Doctrina Social de la Iglesia.' },
            { id: 45, label: 'Servicio', description: 'Dedicación a los demás. Es una manifestación de la caridad, aprendida de Cristo. Implica fomentar la felicidad ajena.' },
            { id: 46, label: 'Apostolado', description: 'Tarea del cristiano de anunciar a Cristo y extender Su Reino. Se realiza en medio del mundo, a través de las obras y palabras, incluyendo el propio trabajo. Se basa en la caridad y la comprensión.' },
            { id: 47, label: 'Lucha espiritual', description: 'Esfuerzo constante del cristiano contra las propias debilidades y las tentaciones, especialmente contra el pecado, la soberbia y el egoísmo. La humildad y la sinceridad son fundamentales para esta lucha.' },
            { id: 48, label: 'Conversión', description: 'Acto inicial y continuo de volver a Dios y reencontrar la luz de Cristo. Implica un examen hondo y estar dispuesto a recomenzar.' },
            { id: 49, label: 'Discipulado', description: 'Condición de aquel que se hace discípulo de Cristo para conocer los misterios del Reino y aprender de Él. Se le reconoce por la caridad mutua.' },
            { id: 50, label: 'Voluntad de Dios', description: 'Los designios de Dios para nuestra vida. Quien cree busca conocerla y hacerla. La oración ayuda a meterla en la vida y a unirse a ella.' }

            edges: edges
        };

                tooltipDelay: 200,
                navigationButtons: true,

                    centralGravity: 0.01,
                    springLength: 100,
                    springConstant: 0.08,
                    damping: 0.6

                    fit: true
                }
            },
            layout: {
                // hierarchical: false // Keep default layout
            }
        };

        // --- Initialization ---
        const network = new vis.Network(container, data, options);

        // --- Popup Logic ---
        const popup = document.getElementById('node-popup');
        const popupTitle = document.getElementById('popup-title');
        const popupDescription = document.getElementById('popup-description');
        const closePopupButton = document.getElementById('close-popup');
        const overlay = document.getElementById('overlay');
        const resetButton = document.getElementById('reset-view-button');

        // Function to show the popup
        function showPopup(title, description) {
            popupTitle.textContent = title;
            popupDescription.textContent = description;
            popup.classList.remove('hidden');
            overlay.classList.remove('hidden');
        }

        // Function to hide the popup
        function hidePopup() {
            popup.classList.add('hidden');
            overlay.classList.add('hidden');
        }

        // Function to reset all nodes and edges to default appearance
        function resetNetworkAppearance() {
            const nodesUpdate = allNodeIds.map(id => ({
                id: id,
                color: {
                    background: defaultNodeBgColor,
                    border: defaultNodeBorderColor
                },
                font: { color: defaultNodeFontColor },
                // hidden: false // Ensure nodes are visible if hidden was used
            }));
            nodes.update(nodesUpdate);

            const edgesUpdate = allEdgeIds.map(id => ({
                id: id,
                color: defaultEdgeColor,
                // hidden: false // Ensure edges are visible
            }));
            edges.update(edgesUpdate);
        }

        // --- Event Listeners ---

        // Event listener for node clicks (Focus & Dim)
        network.on("click", function (params) {
            // First, reset appearance in case a previous node was selected
            resetNetworkAppearance();
            hidePopup(); // Hide popup if a new node is clicked

            if (params.nodes.length > 0) {
                const clickedNodeId = params.nodes[0];
                const nodeData = nodes.get(clickedNodeId);

                // Show popup for the clicked node
                if (nodeData && nodeData.description) {
                    showPopup(nodeData.label, nodeData.description);
                }

                // Focus on the clicked node
                network.focus(clickedNodeId, {
                    scale: 1.0, // Zoom level on focus
                    animation: { duration: 800, easingFunction: 'easeInOutQuad' }
                });

                // Get connected nodes and edges
                const connectedNodeIds = network.getConnectedNodes(clickedNodeId);
                const connectedEdgeIds = network.getConnectedEdges(clickedNodeId);

                // Prepare updates for dimming
                const nodesToUpdate = [];
                const edgesToUpdate = [];

                // Dim unconnected nodes
                allNodeIds.forEach(nodeId => {
                    if (nodeId !== clickedNodeId && !connectedNodeIds.includes(nodeId)) {
                        nodesToUpdate.push({
                            id: nodeId,
                            color: {
                                background: dimmedNodeBgColor,
                                border: dimmedNodeBorderColor
                            },
                            font: { color: dimmedNodeFontColor }
                        });
                    }
                });

                // Dim unconnected edges
                 allEdgeIds.forEach(edgeId => {
                    // Check if the edge connects to the clicked node
                    const edge = edges.get(edgeId);
                    if (edge && edge.from !== clickedNodeId && edge.to !== clickedNodeId) {
                         // Check if the edge connects *between* two directly connected nodes (optional, can keep these visible)
                         // For simplicity, let's dim all edges not directly connected to the clicked node
                         if (!connectedEdgeIds.includes(edgeId)) {
                            edgesToUpdate.push({
                                id: edgeId,
                                color: dimmedEdgeColor
                            });
                         }
                    }
                 });


                // Apply the dimming updates
                if (nodesToUpdate.length > 0) {
                    nodes.update(nodesToUpdate);
                }
                 if (edgesToUpdate.length > 0) {
                    edges.update(edgesToUpdate);
                 }

            } else {
                 // Clicked on the background - reset view? (Optional)
                 // resetNetworkAppearance();
                 // network.fit({ animation: true });
                 hidePopup(); // Hide popup if background is clicked
            }
        });

        // Event listener for the close popup button
        closePopupButton.addEventListener('click', hidePopup);

        // Event listener for the overlay (click outside popup to close)
        overlay.addEventListener('click', hidePopup);

        // Event listener for the Reset View button
        resetButton.addEventListener('click', function() {
            hidePopup(); // Close popup if open
            resetNetworkAppearance(); // Restore default colors
            network.fit({ // Zoom out to fit the whole network
                 animation: { duration: 800, easingFunction: 'easeInOutQuad' }
            });
        });

        // Optional: Fit the network to the view after initial stabilization
        network.once('stabilizationIterationsDone', function () {
            network.fit();
        });

        // Handle window resize to keep the network centered/fitted
        window.addEventListener('resize', function() {
            // Only fit if no node is currently focused/zoomed
            if (network.getScale() === 1.0 && network.getViewPosition().x === 0 && network.getViewPosition().y === 0) {
                 network.fit();
            }
            // Or always fit:
            // network.fit();
        });
